<!DOCTYPE html>
<html lang="en">
  <head>
	<meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>King-Tech Online Store</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<style>
		:root {
		  --primary-color: #392355;
		  --accent-color: #e63946;
		  --bg-color: #f8f8f8;
		}

		body {
		  font-family: Arial, sans-serif;
		  margin: 0;
		  background: var(--bg-color);
		}

		header {
		  background: var(--primary-color);
		  color: white;
		  padding: 1rem;
		  display: flex;
		  justify-content: space-between;
		  align-items: center;
		  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		}

		header h1 {
		  margin: 0;
		  font-size: 1.8rem;
		  flex: 1;
		}

		.cart-icon {
		  position: relative;
		  cursor: pointer;
		  font-size: 1.8rem;
		  transition: transform 0.3s;
		}

		.cart-icon:hover {
		  transform: scale(1.1);
		}

		.cart-count {
		  position: absolute;
		  top: -10px;
		  right: -10px;
		  background: var(--accent-color);
		  color: white;
		  border-radius: 50%;
		  width: 25px;
		  height: 25px;
		  display: flex;
		  align-items: center;
		  justify-content: center;
		  font-weight: bold;
		  font-size: 0.9rem;
		}

		.product-grid {
		  display: grid;
		  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
		  gap: 20px;
		  padding: 20px;
		  max-width: 1200px;
		  margin: auto;
		}

		.product-card {
		  background: white;
		  border-radius: 8px;
		  overflow: hidden;
		  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		  transition: transform 0.2s ease;
		}

		.product-card:hover {
		  transform: translateY(-5px);
		  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
		}

		.product-card img {
		  width: 100%;
		  height: 200px;
		  display: block;
		  object-fit: cover;
		}

		.product-info {
		  padding: 15px;
		}

		.product-info h3 {
		  margin: 0 0 10px;
		  font-size: 1.2rem;
		  color: #333;
		}

		.price {
		  color: var(--accent-color);
		  font-weight: bold;
		  font-size: 1.1rem;
		  margin: 10px 0;
		}

		.description {
		  font-size: 14px;
		  line-height: 1.5;
		  margin-bottom: 15px;
		  color: #666;
		}

		.btn-add {
		  display: inline-block;
		  padding: 8px 12px;
		  background: var(--primary-color);
		  color: white;
		  text-decoration: none;
		  border-radius: 4px;
		  transition: background 0.3s;
		  border: none;
		  cursor: pointer;
		  font-size: 0.9rem;
		  width: 100%;
		}

		.btn-add:hover {
		  background: #2a1a3f;
		  color: white;
		  text-decoration: none;
		}

		/* Cart Sidebar */
		.cart-sidebar {
		  position: fixed;
		  right: -400px;
		  top: 0;
		  width: 400px;
		  height: 100vh;
		  background: white;
		  box-shadow: -2px 0 8px rgba(0,0,0,0.2);
		  transition: right 0.3s ease;
		  z-index: 1000;
		  display: flex;
		  flex-direction: column;
		}

		.cart-sidebar.open {
		  right: 0;
		}

		.cart-header {
		  background: var(--primary-color);
		  color: white;
		  padding: 1rem;
		  display: flex;
		  justify-content: space-between;
		  align-items: center;
		}

		.cart-header h2 {
		  margin: 0;
		  font-size: 1.3rem;
		}

		.close-cart {
		  background: none;
		  border: none;
		  color: white;
		  font-size: 1.5rem;
		  cursor: pointer;
		}

		.cart-items {
		  flex: 1;
		  overflow-y: auto;
		  padding: 1rem;
		}

		.cart-item {
		  background: #f9f9f9;
		  padding: 1rem;
		  margin-bottom: 1rem;
		  border-radius: 4px;
		  border-left: 4px solid var(--primary-color);
		}

		.cart-item-name {
		  font-weight: bold;
		  margin-bottom: 0.5rem;
		}

		.cart-item-price {
		  color: var(--accent-color);
		  font-weight: bold;
		  margin-bottom: 0.5rem;
		}

		.cart-item-quantity {
		  display: flex;
		  align-items: center;
		  gap: 0.5rem;
		  margin-bottom: 0.5rem;
		}

		.qty-btn {
		  background: var(--primary-color);
		  color: white;
		  border: none;
		  width: 25px;
		  height: 25px;
		  border-radius: 3px;
		  cursor: pointer;
		  font-size: 0.9rem;
		}

		.qty-btn:hover {
		  background: #2a1a3f;
		}

		.remove-btn {
		  background: #dc3545;
		  color: white;
		  border: none;
		  padding: 0.25rem 0.5rem;
		  border-radius: 3px;
		  cursor: pointer;
		  font-size: 0.85rem;
		}

		.remove-btn:hover {
		  background: #c82333;
		}

		.cart-empty {
		  text-align: center;
		  color: #999;
		  padding: 2rem 1rem;
		}

		.cart-footer {
		  border-top: 1px solid #eee;
		  padding: 1rem;
		  background: #f9f9f9;
		}

		.cart-total {
		  display: flex;
		  justify-content: space-between;
		  font-weight: bold;
		  margin-bottom: 1rem;
		  font-size: 1.1rem;
		}

		.checkout-btn {
		  width: 100%;
		  padding: 0.75rem;
		  background: #28a745;
		  color: white;
		  border: none;
		  border-radius: 4px;
		  cursor: pointer;
		  font-weight: bold;
		  font-size: 1rem;
		}

		.checkout-btn:hover {
		  background: #218838;
		}

		.checkout-btn:disabled {
		  background: #ccc;
		  cursor: not-allowed;
		}

		.overlay {
		  position: fixed;
		  top: 0;
		  left: 0;
		  width: 100%;
		  height: 100%;
		  background: rgba(0,0,0,0.5);
		  display: none;
		  z-index: 999;
		}

		.overlay.open {
		  display: block;
		}

		.alert {
		  margin: 1rem;
		  padding: 1rem;
		  border-radius: 4px;
		}

		.alert-success {
		  background: #d4edda;
		  color: #155724;
		  border: 1px solid #c3e6cb;
		}

		.alert-error {
		  background: #f8d7da;
		  color: #721c24;
		  border: 1px solid #f5c6cb;
		}

		.loading {
		  display: none;
		  text-align: center;
		  padding: 2rem;
		  color: #666;
		}

		@media (max-width: 768px) {
		  .cart-sidebar {
			width: 100%;
			right: -100%;
		  }

		  header {
			flex-wrap: wrap;
		  }

		  header h1 {
			font-size: 1.3rem;
		  }
		}
    </style>
    </head>
	<body>
    <header>
	  <h1>🛒 King-Tech Online Store</h1>
	  <div class="cart-icon" onclick="toggleCart()">
		<i class="bi bi-bag-check-fill"></i>
		<span class="cart-count" id="cart-count">0</span>
	  </div>
    </header>

	<div class="loading" id="loading">
	  <p>Loading products...</p>
	</div>

	<section class="product-grid" id="product-grid">
	  <!-- Products will be loaded here -->
	</section>

	<!-- Cart Sidebar -->
	<div class="overlay" id="overlay" onclick="toggleCart()"></div>
	<div class="cart-sidebar" id="cart-sidebar">
	  <div class="cart-header">
		<h2>Shopping Cart</h2>
		<button class="close-cart" onclick="toggleCart()">✕</button>
	  </div>
	  <div class="cart-items" id="cart-items">
		<div class="cart-empty">Your cart is empty</div>
	  </div>
	  <div class="cart-footer">
		<div class="cart-total">
		  <span>Total:</span>
		  <span id="cart-total">R0.00</span>
		</div>
		<button class="checkout-btn" id="checkout-btn" onclick="checkout()" disabled>Checkout</button>
	  </div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	
	<script>
	// Configuration
	const API_URL = 'http://localhost:3000/api';
	const CART_STORAGE_KEY = 'king-tech-cart';

	// Fallback products if API is unavailable
	const FALLBACK_PRODUCTS = [
	  {
		id: 1,
		name: 'Dell Pro 15 Laptop',
		price: 16500,
		description: 'Dell Pro 15 PV15250 15.6″ Laptop\n15th Gen\n15.6 inch screen\ni7, 16GB RAM, 512GB SSD, Win 11 Home.',
		image: 'https://tech.co.za/wp-content/uploads/2025/10/Dell-Pro-15-PV1250b.jpg'
	  },
	  {
		id: 2,
		name: 'HP 250 G10 Laptop',
		price: 9500,
		description: 'Hp 250 15.6″ Laptop\n10th Gen\n15.6 inch screen\ni3, 8GB RAM, 256GB SSD, Win 11 Pro.',
		image: 'https://tech.co.za/wp-content/uploads/2025/02/HP-250-G10b.jpg'
	  },
	  {
		id: 3,
		name: 'Lenovo V15 G4 AMN 15.6″ Laptop',
		price: 9000,
		description: 'Levovo V15 G4 AMN Laptop\n15.6 inch screen\nRyzen 5, 8GB RAM, 512GB SSD, Win 11 Home.',
		image: 'https://tech.co.za/wp-content/uploads/2023/09/Lenovo-V15-G4-AMN-Business-Blackb.png'
	  }
	];

	let cart = [];
	let products = [];

	// Initialize on page load
	document.addEventListener('DOMContentLoaded', () => {
	  loadCart();
	  fetchProducts();
	  updateCartUI();
	});

	// Fetch products from API
	async function fetchProducts() {
	  const loading = document.getElementById('loading');
	  loading.style.display = 'block';

	  try {
		const response = await fetch(`${API_URL}/products`);
		if (!response.ok) throw new Error('Failed to fetch products');
		products = await response.json();
	  } catch (error) {
		console.warn('API unavailable, using fallback products:', error);
		products = FALLBACK_PRODUCTS;
	  }

	  loading.style.display = 'none';
	  renderProducts();
	}

	// Render products to the grid
	function renderProducts() {
	  const grid = document.getElementById('product-grid');
	  grid.innerHTML = '';

	  products.forEach(product => {
		const card = document.createElement('div');
		card.className = 'product-card';
		card.innerHTML = `
		  <img src="${product.image}" alt="${product.name}">
		  <div class="product-info">
			<h3>${product.name}</h3>
			<p class="price">R${product.price.toLocaleString('en-ZA')}</p>
			<p class="description">${product.description}</p>
			<button class="btn-add" onclick="addToCart(${product.id}, '${product.name}', ${product.price})">
			  Add to Cart
			</button>
		  </div>
		`;
		grid.appendChild(card);
	  });
	}

	// Add item to cart
	function addToCart(productId, productName, productPrice) {
	  const existingItem = cart.find(item => item.id === productId);

	  if (existingItem) {
		existingItem.quantity++;
	  } else {
		cart.push({
		  id: productId,
		  name: productName,
		  price: productPrice,
		  quantity: 1
		});
	  }

	  saveCart();
	  updateCartUI();
	  showNotification('Item added to cart!', 'success');
	}

	// Remove item from cart
	function removeFromCart(productId) {
	  cart = cart.filter(item => item.id !== productId);
	  saveCart();
	  updateCartUI();
	}

	// Update item quantity
	function updateQuantity(productId, quantity) {
	  const item = cart.find(item => item.id === productId);
	  if (item) {
		if (quantity <= 0) {
		  removeFromCart(productId);
		} else {
		  item.quantity = quantity;
		  saveCart();
		  updateCartUI();
		}
	  }
	}

	// Update cart UI
	function updateCartUI() {
	  const cartCount = document.getElementById('cart-count');
	  const cartItems = document.getElementById('cart-items');
	  const cartTotal = document.getElementById('cart-total');
	  const checkoutBtn = document.getElementById('checkout-btn');

	  // Update cart count
	  const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
	  cartCount.textContent = totalItems;

	  // Update cart items display
	  if (cart.length === 0) {
		cartItems.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
		checkoutBtn.disabled = true;
	  } else {
		cartItems.innerHTML = cart.map(item => `
		  <div class="cart-item">
			<div class="cart-item-name">${item.name}</div>
			<div class="cart-item-price">R${item.price.toLocaleString('en-ZA')}</div>
			<div class="cart-item-quantity">
			  <button class="qty-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
			  <span>${item.quantity}</span>
			  <button class="qty-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
			</div>
			<button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
		  </div>
		`).join('');
		checkoutBtn.disabled = false;
	  }

	  // Update total
	  const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
	  cartTotal.textContent = `R${total.toLocaleString('en-ZA', { minimumFractionDigits: 2 })}`;
	}

	// Toggle cart sidebar
	function toggleCart() {
	  const sidebar = document.getElementById('cart-sidebar');
	  const overlay = document.getElementById('overlay');
	  sidebar.classList.toggle('open');
	  overlay.classList.toggle('open');
	}

	// Checkout
	async function checkout() {
	  if (cart.length === 0) {
		showNotification('Cart is empty', 'error');
		return;
	  }

	  const checkoutBtn = document.getElementById('checkout-btn');
	  checkoutBtn.disabled = true;
	  checkoutBtn.textContent = 'Processing...';

	  const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
	  const orderData = {
		items: cart,
		total: total
	  };

	  try {
		const response = await fetch(`${API_URL}/orders`, {
		  method: 'POST',
		  headers: {
			'Content-Type': 'application/json'
		  },
		  body: JSON.stringify(orderData)
		});

		if (!response.ok) throw new Error('Checkout failed');

		const order = await response.json();
		showNotification(`Order placed successfully! Order #${order.id}`, 'success');
		clearCart();
		toggleCart();
	  } catch (error) {
		showNotification('Checkout failed: ' + error.message, 'error');
	  } finally {
		checkoutBtn.disabled = false;
		checkoutBtn.textContent = 'Checkout';
	  }
	}

	// Save cart to localStorage
	function saveCart() {
	  localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
	}

	// Load cart from localStorage
	function loadCart() {
	  const saved = localStorage.getItem(CART_STORAGE_KEY);
	  cart = saved ? JSON.parse(saved) : [];
	}

	// Clear cart
	function clearCart() {
	  cart = [];
	  saveCart();
	  updateCartUI();
	}

	// Show notification
	function showNotification(message, type) {
	  const alertDiv = document.createElement('div');
	  alertDiv.className = `alert alert-${type}`;
	  alertDiv.textContent = message;
	  document.body.insertBefore(alertDiv, document.body.firstChild);

	  setTimeout(() => {
		alertDiv.remove();
	  }, 3000);
	}
	</script>
	</body>
</html>
